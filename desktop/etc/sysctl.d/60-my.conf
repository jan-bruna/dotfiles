##sudo-rs sysctl --system
##sysctl net.ipv4.tcp_syncookies

net.ipv4.tcp_syncookies = 1

net.ipv4.tcp_rfc1337 = 1

net.ipv4.icmp_echo_ignore_broadcasts = 1

net.ipv4.icmp_ignore_bogus_error_responses = 1

#suspicious for privacy if 1
net.ipv4.icmp_echo_ignore_all = 0
net.ipv6.icmp.echo_ignore_all = 0

net.ipv4.conf.*.rp_filter = 1

net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

#may be redundant?
net.ipv4.conf.*.shared_media = 0

#suspicious for privacy if 1 or 2
net.ipv4.conf.*.arp_ignore = 0

net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0

net.ipv6.conf.*.use_tempaddr = 2

#maybe 2 (for root)
net.core.bpf_jit_harden = 2

kernel.yama.ptrace_scope = 1

kernel.unprivileged_bpf_disabled = 1

kernel.sysrq = 0

#maybe too restrictive for low level experiments
kernel.perf_event_paranoid = 3

#hide kernel pointers, change needed for kernel debugging
kernel.kptr_restrict = 2

kernel.dmesg_restrict = 1

kernel.oops_limit=100

#maybe set to 100?
kernel.warn_limit=1000

#turned off?
fs.binfmt_misc.status = 0

#fs.suid_dumpable = 0

fs.protected_regular = 2

fs.protected_fifos = 2

fs.protected_hardlinks = 1
fs.protected_symlinks = 1

dev.tty.ldisc_autoload = 0

dev.tty.legacy_tiocsti = 0

vm.unprivileged_userfaultfd = 0

kernel.kexec_load_disabled = 1

#maybe in future back to 0
kernel.io_uring_disabled = 2

vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

kernel.randomize_va_space = 2

net.mptcp.enabled = 0


#may break something
net.ipv4.conf.*.secure_redirects = 0
vm.memfd_noexec = 1
#may BREAK something if 1, 2 or 3
net.core.devconf_inherit_init_net = 0
#suspicious for privacy if 1
net.ipv6.bindv6only = 0
